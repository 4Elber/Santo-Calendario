kind = "web"
previewPath = "/"
title = "Calendário dos Santos"
version = "1.0.0"
id = "artifacts/santos-calendario"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19029

[services.development]
run = "pnpm --filter @workspace/santos-calendario run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/santos-calendario", "run", "build" ]
publicDir = "artifacts/santos-calendario/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19029"
BASE_PATH = "/"
